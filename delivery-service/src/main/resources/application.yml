server:
  port: ${PORT:${SERVER_PORT:8087}}   # Render injects PORT; local fallback stays 8087

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: delivery-service            # Eureka registration name — MUST match gateway route lb://delivery-service

  cloud:
    config:
      enabled: false                  # Disable config server (same as auth/cart)

  # ── Database ─────────────────────────────────────────────────────────────────
  datasource:
    url: ${QUICKBITE_DELIVERY_DB_URL:jdbc:mysql://localhost:3306/quickbite_delivery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUICKBITE_DELIVERY_DB_USERNAME:root}
    password: ${QUICKBITE_DELIVERY_DB_PASSWORD:}
    driver-class-name: ${QUICKBITE_DELIVERY_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: ${QUICKBITE_DELIVERY_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true

  sql:
    init:
      mode: never

# ── Eureka Client ──────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${QUICKBITE_RABBITMQ_HOST:localhost}
    port: ${QUICKBITE_RABBITMQ_PORT:5672}
    username: ${QUICKBITE_RABBITMQ_USERNAME:guest}
    password: ${QUICKBITE_RABBITMQ_PASSWORD:guest}

# â”€â”€ Eureka Client â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
eureka:
  client:
    service-url:
      defaultZone: ${QUICKBITE_EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── JWT Config ────────────────────────────────────────────────────────────────
# MUST match auth-service secret exactly
# restaurant-service uses raw bytes, cart-service also uses raw bytes
# delivery-service follows restaurant-service pattern (raw bytes)
jwt:
  secret: ${QUICKBITE_DELIVERY_JWT_SECRET:}

# ── Feign Client ──────────────────────────────────────────────────────────────
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.quickbite.delivery_service: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

