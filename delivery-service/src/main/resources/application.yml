server:
  port: 8087 # delivery-service port (as per API Gateway config)

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: delivery-service # Eureka registration name must match gateway route lb://delivery-service

  cloud:
    config:
      enabled: false # Disable config server (same as auth/cart)

  datasource:
    url: ${QUICKBITE_DELIVERY_DB_URL:jdbc:mysql://localhost:3306/quickbite_delivery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUICKBITE_DELIVERY_DB_USERNAME}
    password: ${QUICKBITE_DELIVERY_DB_PASSWORD}
    driver-class-name: ${QUICKBITE_DELIVERY_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: ${QUICKBITE_DELIVERY_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true

  sql:
    init:
      mode: never

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${QUICKBITE_DELIVERY_JWT_SECRET}

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.quickbite.delivery_service: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
