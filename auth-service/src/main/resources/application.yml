server:
  port: ${SERVER_PORT:8081}           # auth-service runs on 8081

spring:
  config:
    import: optional:file:.env[.properties],optional:file:auth-service/.env[.properties]
  cloud:
    config:
      enabled: false
  application:
    name: ${SPRING_APPLICATION_NAME:auth-service}                # Eureka registration name

  # ── Database ────────────────────────────────────────────────────────────────
  datasource:
    url: ${QUICKBITE_AUTH_DB_URL:jdbc:mysql://localhost:3306/quickbite_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUICKBITE_AUTH_DB_USERNAME:root}
    password: ${QUICKBITE_AUTH_DB_PASSWORD:}
    driver-class-name: ${QUICKBITE_AUTH_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update                # 'create' on first run, then 'update'
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${QUICKBITE_AUTH_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

  sql:
    init:
      mode: never

  # ── OAuth2 ─────────────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-with-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-with-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          github:
            client-id: ${GITHUB_CLIENT_ID:replace-with-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:replace-with-github-client-secret}
            scope:
              - user:email
              - read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"



  # ── Config Server ──────────────────────────────────────────────────────────
  # Uncomment when Config Server is set up
  # config:
  #   import: optional:configserver:http://localhost:8888

# ── Eureka Client ─────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}     # ← Your Eureka Server
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── JWT Configuration ─────────────────────────────────────────────────────────
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  jwt:
    # Generate with: openssl rand -base64 64
    # This MUST be the same secret across all services if they validate locally.
    # But since we use centralized validation (POST /validate-token), each
    # service doesn't need this — only auth-service needs it.
    secret: ${APP_JWT_SECRET:replace-with-base64-secret}

    # Access token: 24 hours
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

    # Refresh token: 7 days
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Actuator (for Eureka health check) ───────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.quickbite.auth: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
