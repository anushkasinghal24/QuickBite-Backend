name: SonarQube

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

          QUICKBITE_AUTH_DB_URL: ${{ secrets.QUICKBITE_AUTH_DB_URL }}
          QUICKBITE_AUTH_DB_USERNAME: ${{ secrets.QUICKBITE_AUTH_DB_USERNAME }}
          QUICKBITE_AUTH_DB_PASSWORD: ${{ secrets.QUICKBITE_AUTH_DB_PASSWORD }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}

          QUICKBITE_JWT_SECRET: ${{ secrets.QUICKBITE_JWT_SECRET }}
          QUICKBITE_FRONTEND_URL: ${{ secrets.QUICKBITE_FRONTEND_URL }}

        run: |
          mvn -B clean verify -Dspring.profiles.active=test

          echo "Searching JaCoCo reports..."
          find . -name "jacoco.xml" -print
          find . -type d -name "jacoco*" -print

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=anushkasinghal24_QuickBite-Backend \
            -Dsonar.organization=anushkasinghal24 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco-aggregate/jacoco.xml,**/target/site/jacoco/jacoco.xml