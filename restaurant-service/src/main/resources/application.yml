server:
  port: 8082

spring:
  application:
    name: restaurant-service

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:configserver:${QUICKBITE_CONFIG_SERVER_URL:http://localhost:8888}

  # ========== DATABASE CONFIG ==========
  datasource:
    url: ${QUICKBITE_RESTAURANT_DB_URL:jdbc:mysql://localhost:3306/quickbite_restaurant?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUICKBITE_RESTAURANT_DB_USERNAME:root}
    password: ${QUICKBITE_RESTAURANT_DB_PASSWORD}
    driver-class-name: ${QUICKBITE_RESTAURANT_DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update   # first run ke baad 'validate' kar dena
    show-sql: true
    properties:
      hibernate:
        dialect: ${QUICKBITE_RESTAURANT_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true

  cloud:
    config:
      fail-fast: false

  sql:
    init:
      mode: never

quickbite:
  delivery:
    base-url: ${QUICKBITE_DELIVERY_BASE_URL:http://localhost:8087}
  notification:
    base-url: ${QUICKBITE_NOTIFICATION_BASE_URL:http://localhost:8084}

# ========== EUREKA CLIENT ==========
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ========== JWT CONFIG ==========
jwt:
  secret: ${QUICKBITE_JWT_SECRET}
  expiration: ${QUICKBITE_JWT_EXPIRATION:86400000}   # 24 hours in ms

# ========== FEIGN CLIENT TIMEOUTS ==========
# ========== ACTUATOR ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ========== SWAGGER ==========
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ========== LOGGING ==========
logging:
  level:
    com.quickbite.restaurant: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
