server:
  port: 8084   # auth=8081, restaurant=8082, cart=8083, payment=8084

spring:
  application:
    name: payment-service
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./payment-service/.env[.properties]

  # ── Database ─────────────────────────────────────────────────────────────
  datasource:
    url: ${QUICKBITE_PAYMENT_DB_URL:jdbc:mysql://localhost:3306/quickbite_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUICKBITE_PAYMENT_DB_USERNAME:root}
    password: ${QUICKBITE_PAYMENT_DB_PASSWORD}
    driver-class-name: ${QUICKBITE_PAYMENT_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${QUICKBITE_PAYMENT_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

  # Config Server (disabled like auth-service)
  cloud:
    config:
      enabled: false

  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${QUICKBITE_MAIL_USERNAME}
    password: ${QUICKBITE_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── Eureka Client ─────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── JWT — MUST match auth-service secret exactly ──────────────────────────
jwt:
  secret: ${QUICKBITE_JWT_SECRET}
  expiration: 86400000

# ── Feign Client ─────────────────────────────────────────────────────────
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
  circuitbreaker:
    enabled: true

# ── Actuator ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Swagger ──────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    com.quickbite.payment_service: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

notification:
  email:
    from: ${QUICKBITE_NOTIFICATION_EMAIL_FROM:QuickBite <quickbite.noreply@gmail.com>}
  sms:
    enabled: false
  email-enabled: true

sms:
  provider: mock
  twilio:
    account-sid: ${QUICKBITE_TWILIO_ACCOUNT_SID}
    auth-token: ${QUICKBITE_TWILIO_AUTH_TOKEN}
    from-number: ${QUICKBITE_TWILIO_FROM_NUMBER:+1234567890}
