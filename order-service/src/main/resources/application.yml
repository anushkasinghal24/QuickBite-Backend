server:
  port: 8085

spring:
  application:
    name: order-service

  datasource:
    url: ${QUICKBITE_ORDER_DB_URL:jdbc:mysql://localhost:3306/quickbite_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUICKBITE_ORDER_DB_USERNAME:root}
    password: ${QUICKBITE_ORDER_DB_PASSWORD:AnushkaSinghal24}
    driver-class-name: ${QUICKBITE_ORDER_DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: ${QUICKBITE_ORDER_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true

  sql:
    init:
      mode: never

# ── Eureka ────────────────────────────────────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ── JWT secret — MUST match auth-service exactly ────────────────────
jwt:
  secret: ${QUICKBITE_ORDER_JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBxdWlja2JpdGUgcGxhdGZvcm0gand0IHRva2Vu}
  expiration: 86400000   # 24 hours in ms

# ── Feign Client timeouts ────────────────────────────────────────────
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

# ── Actuator ─────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.quickbite.order_service: DEBUG
