server:
  port: ${SERVER_PORT:8085}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${SPRING_APPLICATION_NAME:order-service}

  datasource:
    url: ${QUICKBITE_ORDER_DB_URL:jdbc:mysql://localhost:3306/quickbite_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${QUICKBITE_ORDER_DB_USERNAME:root}
    password: ${QUICKBITE_ORDER_DB_PASSWORD:}
    driver-class-name: ${QUICKBITE_ORDER_DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: ${QUICKBITE_ORDER_HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        format_sql: true

  sql:
    init:
      mode: never

  rabbitmq:
    host: ${QUICKBITE_RABBITMQ_HOST:localhost}
    port: ${QUICKBITE_RABBITMQ_PORT:5672}
    username: ${QUICKBITE_RABBITMQ_USERNAME:guest}
    password: ${QUICKBITE_RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${QUICKBITE_EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${QUICKBITE_ORDER_JWT_SECRET:}
  expiration: ${QUICKBITE_ORDER_JWT_EXPIRATION:86400000}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.quickbite.order_service: DEBUG
